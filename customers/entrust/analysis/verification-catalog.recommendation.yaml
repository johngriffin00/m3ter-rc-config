# ==============================================================================
decisions:
  D1:
    title: Rate cards carry the price; PricebookEntry.UnitPrice stays 0
    because: >-
      Usage rating in Revenue Cloud runs off RateCardEntry, which also gives dated
      effectivity (m3ter's versioned price lists) and attribute adjustments
      (m3ter's segments). PricebookEntry has neither. The Claude catalog already
      does exactly this for P_ClaudeAPIUsage.
    verified_in_org: >-
      m3ter-arm-260 has only the Standard Price Book and every pre-seeded RateCard
      hangs off it through PriceBookRateCard. Both Verification rate cards were
      built that way (PRC-00000009 USD, PRC-00000010 EUR). "Rate Card D (USD)" and
      "Rate Card B (EUR)" are therefore two RateCards under one price book; the
      price_books[] entries here are rate cards, and `code: PB-…` is a misnomer
      kept for traceability.
  D2:
    title: Define IS-RETRY, price nothing on it yet
    because: >-
      Both templates charge is_retry:true and is_retry:false the same. An
      AttributeBasedAdjRule with a 0 adjustment is noise; the attribute itself is
      cheap and matches m3ter's data model, so the day a retry discount appears it
      is one rule, not a product change. Same mechanism the token rate card uses.
  D3:
    title: Bundles are products with their own usage resource
    because: >-
      Revenue Cloud cannot rate max(resource_a, resource_b). Inventing it with
      decision tables or Apex would put rating logic in two systems. The metering
      side already computes the max (that is what the CompoundAggregation is), so
      RC receives one usage record for the bundle resource and rates it at one
      price. Components rated at 0 under the contract, as m3ter does today.
    rejected:
      - Bundle Product2 with component products as a configured bundle (ProductRelatedComponent):
          "a sales bundle, not a rating bundle; it does not change what is rated"
      - Grants (ProductUsageGrant) to absorb component usage:
          "grants are quantity-based prepaid allowances, not a max() function"
  D4:
    title: Account overlays are recorded, not built
    because: >-
      Plan-level overrides and bundle prices are contract terms, not catalog. In
      Revenue Cloud they live on the quote line / contract (negotiated price,
      price adjustments), which rc-config does not manage. The overlay section
      exists so whoever builds the contract side has the exact numbers.
  D5:
    title: Load only the current EUR price version
    because: >-
      rc-config matches RateCardEntry on (RateCardId, ProductId), so it can hold
      one entry per product per card. Historic versions would need either
      EffectiveFrom in the match key or one RateCard per version. Nothing in RC
      needs to re-rate 2022 usage.
    follow_up: if price history must be queryable in RC, extend rc-config's match key before loading.
  D6:
    title: Product names come from m3ter, de-duplicated and de-jargoned
    because: >-
      Product2.Name must be unique and customer-facing. Three meters are all named
      "Mastercard Identity" (region is only in the code), "Motion PLG" names a
      go-to-market motion rather than the product, and "Document Check Video" is
      ambiguous next to "Document Check Video - Boost". m3ter codes are kept
      verbatim as the traceable key.
  D7:
    title: Free add-ons stay in the catalog at 0
    because: >-
      autofill, device intelligence, known faces, repeat attempts and ongoing
      monitoring top-up are 0 in every list. Dropping them would leave their usage
      unrated and unreported; keeping them costs one product each.

open_questions:
  - Is "Rate Card B" vs "Rate Card D" a currency split or a pricing tier? Only one template per currency was exported, so this file treats them as currency rate cards. If tiers exist (A/C/E...), each is another RateCard under the Standard Price Book with the same products.
  - ProductClassificationAttr.IsRequired would not save as true from the UI; decide whether Is Retry must be required at quote time and set it by API if so.
  - PLG bundle: two-way or three-way? See bundles[].anomaly.
  - The DAILY-billed "Product Bundles" m3ter product is a billing-cadence artefact of how m3ter carries compound aggregations; nothing in RC should be daily.
  - Grants: nothing in these two accounts is prepaid or committed. If other accounts have minimum spend or committed volumes, that is where ProductUsageGrant enters.
