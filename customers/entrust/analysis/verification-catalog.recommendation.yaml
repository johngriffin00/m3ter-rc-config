  # Bundles: m3ter CompoundAggregations. m3ter rates max(component counts) at a
  # single price and zeroes the components on the account's plan. Revenue Cloud
  # has no "max of two resources" rating, so each bundle becomes its own product
  # with its own usage resource, fed by the metering side (decision D3).
  bundles:
    - code: VC-BUNDLE-AE
      name: 'Document Check - Boost PLG & Facial Similarity Check - Selfie Hybrid'
      category: Bundles
      m3ter_compound_aggregation: AE
      m3ter_calculation: 'Math.max(aggregation.document_report_standard_hybrid_count, aggregation.facial_similarity_report_standard_count)'
      components: ['VC-DOCUMENT-REPORT-STANDARD-HYBRID', 'VC-FACIAL-SIMILARITY-REPORT-STANDARD']
      rule: max_of_components      # the metering side computes it; RC rates the result
      resource: {code: RES-BUNDLE-AE, unit: CHECK, category: Usage}
      classification: PC-VERIFICATION-CHECK
      observed_price: {USD: 1.54}   # plan-level in m3ter (bespoke, State of Delaware); no list price exists
    - code: VC-BUNDLE-PLG
      name: 'Document Check - Boost PLG & Motion'
      category: Bundles
      m3ter_compound_aggregation: PLG
      m3ter_calculation: 'Math.max(aggregation.document_report_standard_hybrid_count,aggregation.facial_similarity_report_motion_count,aggregation.watchlist_report_aml_count)'
      components: ['VC-DOCUMENT-REPORT-STANDARD-HYBRID', 'VC-FACIAL-SIMILARITY-REPORT-MOTION', 'VC-WATCHLIST-REPORT-AML']
      rule: max_of_components      # the metering side computes it; RC rates the result
      resource: {code: RES-BUNDLE-PLG, unit: CHECK, category: Usage}
      classification: PC-VERIFICATION-CHECK
      observed_price: {EUR: 1.82}   # plan-level in m3ter (bespoke, Finrate AG); no list price exists
      anomaly: >-
        The m3ter calculation includes watchlist_report_aml_count, but customFields.product_1/2 name only
        two components and Finrate's plan does NOT zero Watchlist-AML (it stays at EUR 0.56). Either
        Watchlist-AML is double-charged today or the formula is stale. Confirm with the m3ter owner
        before modelling it as a three-way bundle.

# ==============================================================================
# One price book per m3ter PlanTemplate. The template IS the price list: its
# currency, its billing cadence and the list rate for every aggregation.
# Each becomes a RateCard + PriceBookRateCard under the STANDARD price book
# (verified in org, see D1) — not a second Pricebook2 — with a 0.00
# PricebookEntry per product (the pattern PBE_ClaudeAPIUsage uses) and the real
# rate on a RateCardEntry. See decision D1 for why rate cards and not PBE.UnitPrice.
price_books:
  - code: PB-RATECARD-D-USD
    name: 'Rate Card D (USD)'
    currency: USD
    m3ter_plan_template: rate_card_d_usd_default_pricing
    m3ter_bill_frequency: MONTHLY x1; standing charge 0.0; no minimum spend
    rate_card: {name: 'Verification Rate Card D (USD)', type: Base, effective_from: 2025-09-14}   # Base: matches every pre-seeded rate card in the org
    rate_unit: USD
    note: m3ter has a single undated version (1900-01-01 → open), so effective_from is the earliest contract that uses it.
    rates:                        # per CHECK (or BLOCK); flat, one band, no tiers, no fixed component
      VC-DOCUMENT-REPORT-STANDARD-HYBRID: 1.59
      VC-DOCUMENT-REPORT-STANDARD-AUTO: 0.54
      VC-DOCUMENT-REPORT-STANDARD-MANUAL: 2.78
      VC-DOCUMENT-REPORT-DRIVER-VERIFICATION: 1.59
      VC-DOCUMENT-REPORT-VIDEO: 2.05
      VC-DOCUMENT-REPORT-VIDEO-ETSI-CERTIFIED-IDV: {IS-RETRY=FALSE: 3.72, IS-RETRY=TRUE: 3.72}   # identical today: no adjustment rule needed (D2)
      VC-DOCUMENT-REPORT-VIDEO-ETSI-CERTIFIED-IDV-WITH-QES-AND-OTP: {IS-RETRY=FALSE: 4.03, IS-RETRY=TRUE: 4.03}   # identical today: no adjustment rule needed (D2)
      VC-AUTOFILL: 0.0
      VC-FACIAL-SIMILARITY-REPORT-STANDARD: 0.95
      VC-FACIAL-SIMILARITY-REPORT-PHOTO-FULLY-AUTO: 0.77
      VC-FACIAL-SIMILARITY-REPORT-VIDEO: 1.36
      VC-FACIAL-SIMILARITY-REPORT-MOTION: 1.21
