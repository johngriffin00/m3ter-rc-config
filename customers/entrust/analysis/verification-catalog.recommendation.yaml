# Revenue Cloud recommendation: the Verification Check catalog (from m3ter)
#
# Generated 2026-10-06 from two m3ter account exports:
#   0010800002pezwdAAA  State of Delaware  (USD, "Rate Card D USD Default Pricing")
#   00108000031Xp6xAAC  Finrate AG         (EUR, "Rate Card B EUR Default Pricing")
# Both accounts share one m3ter catalog (33 meters, 33 aggregations, identical in
# both exports), so this is ONE shared catalog + two account overlays.
#
# How to read this file
#   * It sits one level ABOVE rc-config's config/*.json: every entry here implies
#     a cluster of sObjects (listed under `rc_mapping`). It is meant to be argued
#     over by people before any sObject is named. rc-config JSON is generated
#     from it, by hand for the first account and by a small compiler later.
#   * Keys prefixed `m3ter_` are copied verbatim from the exports so every line
#     is traceable. Everything else is the recommendation.
#   * `decision:` blocks record the choices that are not forced by the data.
#   * `verify_in_org:` marks claims that must be checked against the org before
#     they become config. Items marked `verified_in_org:` were settled by
#     building the worked example in m3ter-arm-260 on 2026-10-06 (see the
#     setup manual, Claude Docs "Revenue Cloud Verification Catalog — Setup Manual").
#   * Rationale for the mapping is in models/m3ter-to-revenue-cloud.md.

meta:
  generated: 2026-10-06
  sources:
    - 0010800002pezwdAAA-config.json   # State of Delaware
    - 00108000031Xp6xAAC-config.json   # Finrate AG
  model: models/claude-catalog-data-model.html
  status: >-
    recommendation; worked example (Document Check - Boost + bundle AE, both rate
    cards, USD/EUR/bundle rate card entries) built by hand in m3ter-arm-260 on
    2026-10-06 and SOQL-verified Active. Remaining 31 products not yet applied.
  org_lessons:                        # things the build taught us that change the config
    - UnitOfMeasureClass is Draft-only on create (same as UsageResource, ProductUsageResource, RateCardEntry, ProductUsageGrant); activate after its default unit exists
    - UnitOfMeasure.Type offers only "Custom" in the UI (pre-seeded USD is "Cost"); set Type by API if it must match
    - UsageResource category values are Usage / Token / Currency (not "Verification")
    - RateCard in this org: Type Base, RateUnitOfMeasure = currency unit, DefaultUnitOfMeasure = resource unit, Negotiable, linked to the Standard Price Book via PriceBookRateCard
    - ProductClassificationAttr.IsRequired saved as false although ticked in the UI; untested by API
    - EffectiveFrom is a datetime; a date-only value lands at noon in the UI and needs explicit midnight in the org timezone by API

# ------------------------------------------------------------------------------
# rc_mapping: what each section of this file becomes in Revenue Cloud, in the
# load order the model already uses (numbers = the model's `seq`).
# ------------------------------------------------------------------------------
rc_mapping:
  catalog.attributes:        [AttributePicklist(1), AttributePicklistValue(2), AttributeDefinition(3)]
  catalog.classifications:   [ProductClassification(4), ProductClassificationAttr(5)]
  catalog.units:             [UnitOfMeasure(6), UnitOfMeasureClass(7)]        # lookup-only if the org has them
  catalog.products[].resource: [UsageResource(8), ProductUsageResource(15)]  # one per meter
  catalog.products:          [Product2(10), ProductSellingModelOption(14)]
  catalog.categories:        [ProductCatalog(11), ProductCategory(12), ProductCategoryProduct(13)]
  price_books:               [Pricebook2(18), PricebookEntry(19), RateCard(20), PriceBookRateCard(21), RateCardEntry(22)]
  catalog.attributes (priced): [AttributeBasedAdjRule(23), AttributeAdjustmentCondition(24), RateAdjustmentByAttribute(25)]
  not_mapped:
    - ProductUsageGrant / UsagePrdGrantBindingPolicy  # no grants: nothing in m3ter is prepaid or included
    - accounts[]                                      # contract-level; outside PCM, see decision D4

# ==============================================================================
catalog:
  name: Verification Checks
  selling_model:
    use: PSM_EvergreenMonthly            # already in config/05-selling-models.json (lookup-only)
    why: m3ter bills these monthly in arrears with no term; same model the Claude API usage product uses.

  units:
    class: {code: VERIFICATION-UOM-CLASS, name: Verification Usage}
    members:
      - {code: CHECK, name: Check,  m3ter_units_seen: [check, checks, sum]}   # "sum" on mastercard_emea is an m3ter typo
      - {code: BLOCK, name: Block,  m3ter_units_seen: [blocks]}              # ongoing monitoring only
    rate_units:                          # RateCardEntry.RateUnitOfMeasureId, as the Claude rate card does with UOM_USD
      - {code: USD, existing: UOM_USD}
      - {code: EUR, verified_in_org: "did not exist; created as UnitOfMeasure 'EUR' (Type Custom; USD's is Cost, not offered in the UI) in the pre-seeded Currency class 1BQWs0000005OWPOA2, id 0hEWs0000018yHlMAI, accepted as RateUnitOfMeasure on the EUR rate card and entries; rating with a Custom-type currency unit not tested"}

  attributes:
    - code: IS-RETRY
      name: Is Retry
      m3ter_field: is_retry                # category WHAT on the two ETSI video meters; segmentedFields on their aggregations
      picklist: {code: PL-VC-ISRETRY, values: [{code: TRUE, value: "true"}, {code: FALSE, value: "false"}]}
      decision: D2
      priced_today: false                  # both price lists charge retry == non-retry (see price_books). Define the attribute,
                                           # add NO AttributeBasedAdjRule until a price delta exists.

  classifications:
    - code: PC-VERIFICATION-CHECK
      name: Verification Check
      attributes: []
    - code: PC-VERIFICATION-CHECK-RETRY
      name: Verification Check (retry-aware)
      attributes: [IS-RETRY]
      used_by: [document_report_video_ETSI_Certified_IDV, document_report_video_ETSI_Certified_IDV_with_QES_and_OTP]

  product_catalog: {code: CAT-VERIFICATION, name: Verification Catalog}
  categories:                              # one ProductCategory each, under the catalog above

    - {code: CAT-DOCUMENT-CHECKS, name: 'Document Checks'}
    - {code: CAT-BIOMETRICS, name: 'Biometrics'}
    - {code: CAT-WATCHLIST-MONITORING, name: 'Watchlist & Monitoring'}
    - {code: CAT-IDENTITY-DATA, name: 'Identity Data'}
    - {code: CAT-EID-SIGNATURES, name: 'eID & Signatures'}
    - {code: CAT-BUNDLES, name: 'Bundles'}

  # One product per m3ter meter. The aggregation is always SUM(check_count) with
  # quantityPerUnit 1, so meter == aggregation == product; no information is lost
  # by collapsing them. Product2.UsageModelType: Pack, like P_ClaudeAPIUsage.
