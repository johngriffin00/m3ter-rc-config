    VC-FACIAL-SIMILARITY-REPORT-VIDEO: 1.53
    VC-FACIAL-SIMILARITY-REPORT-MOTION: 1.36
    VC-KNOWN-FACES-REPORT-STANDARD: 0.00
    VC-REPEAT-ATTEMPTS-REPORT-STANDARD: 0.00
    VC-APPLICANT-FRAUD-REPORT-STANDARD: 0.00
    VC-PROOF-OF-ADDRESS-REPORT-STANDARD: 2.28
  pricebook_entries: "0.00 for every product above and the CSM fee; the commitment's entry is 1.00 (see commercial_products)"

